name: Test free Windows runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Verify Windows runner
        shell: pwsh
        run: |
          Write-Host "Windows runner started successfully"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Python:"
          python --version
